<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0d16"/>
<title>NorthLab CRM</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        background: '#080b14',
        card: '#0d1120',
        border: '#1e2540',
        primary: '#2563eb',
        accent: '#06b6d4',
        muted: '#3a4166',
      }
    }
  }
}
</script>
<style>
  body { background:#080b14; color:#eef0ff; font-family:system-ui,sans-serif; margin:0; }
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:#1e2540;border-radius:99px}
  input,select,textarea{background:#0d1120;color:#eef0ff;border:1px solid #1e2540;border-radius:8px;padding:6px 10px;outline:none;width:100%;box-sizing:border-box;font-size:13px;}
  input:focus,select:focus,textarea:focus{border-color:#2563eb;}
  select option{background:#0d1120;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#0d1120;border:1px solid #1e2540;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.15s;}
  .btn-primary{background:linear-gradient(to right,#2563eb,#06b6d4);color:#fff;}
  .btn-primary:hover{opacity:0.88;}
  .btn-secondary{background:#0d1120;color:#8891b8;border:1px solid #1e2540;}
  .btn-secondary:hover{color:#eef0ff;border-color:#2563eb44;}
  .btn-danger{background:#991b1b22;color:#ef4444;}
  .btn-danger:hover{background:#991b1b44;}
  .badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
  .badge-green{background:#05966920;color:#10b981;}
  .badge-red{background:#ef444420;color:#ef4444;}
  .badge-yellow{background:#f59e0b20;color:#f59e0b;}
  .badge-blue{background:#2563eb20;color:#60a5fa;}
  .badge-gray{background:#1e254033;color:#8891b8;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:#8891b8;cursor:pointer;transition:all 0.15s;text-decoration:none;}
  .nav-item:hover{background:#1e254044;color:#eef0ff;}
  .nav-item.active{background:#2563eb22;color:#3b82f6;border-left:2px solid #2563eb;}
  .progress-bar{height:6px;background:#1e2540;border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(to right,#2563eb,#06b6d4);border-radius:99px;transition:width 0.3s;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10px;font-weight:600;color:#8891b8;text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:1px solid #1e2540;}
  td{padding:9px 10px;font-size:12px;border-bottom:1px solid #1e254033;}
  tr:hover td{background:#1e254022;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line } = Recharts;

// ── Storage helpers ──────────────────────────────────────────────
const db = {
  get: (k) => { try { return JSON.parse(localStorage.getItem('nl_' + k) || '[]'); } catch { return []; } },
  set: (k, v) => localStorage.setItem('nl_' + k, JSON.stringify(v)),
  uid: () => Math.random().toString(36).slice(2) + Date.now().toString(36),
  now: () => new Date().toISOString(),
};

// ── Icons (inline SVG) ───────────────────────────────────────────
const Icon = ({ d, size=16, color='currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);
const Icons = {
  home: "M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",
  dashboard: "M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z",
  revenue: "M12 1v22 M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6",
  goals: "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 8v4l3 3",
  settings: "M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z",
  logout: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9",
  plus: "M12 5v14 M5 12h14",
  trash: "M3 6h18 M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6 M10 11v6 M14 11v6 M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2",
  note: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8",
  menu: "M3 12h18 M3 6h18 M3 18h18",
  x: "M18 6L6 18 M6 6l12 12",
  check: "M20 6L9 17l-5-5",
};

const fmtMoney = (n) => '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

const statusBadge = (s) => {
  const map = {
    'PIF': 'badge-green', 'Installment': 'badge-blue', 'Showed': 'badge-green',
    'No Show': 'badge-red', 'Rescheduled': 'badge-yellow', 'Cancelled': 'badge-red',
    'Offered': 'badge-blue',
  };
  return <span className={`badge ${map[s] || 'badge-gray'}`}>{s}</span>;
};

// ── Modal wrapper ────────────────────────────────────────────────
function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <span style={{fontWeight:700,fontSize:16}}>{title}</span>
          <button className="btn btn-secondary" style={{padding:'4px 8px'}} onClick={onClose}>
            <Icon d={Icons.x} size={14}/>
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── Sidebar ──────────────────────────────────────────────────────
function Sidebar({ page, setPage, userName, role, onSignOut, mobileOpen, setMobileOpen }) {
  const items = [
    { id: 'home', label: 'Home', icon: Icons.home },
    { id: 'dashboard', label: 'Dashboard', icon: Icons.dashboard },
    { id: 'revenue', label: 'Revenue', icon: Icons.revenue },
    { id: 'goals', label: 'Goals', icon: Icons.goals },
    { id: 'settings', label: 'Settings', icon: Icons.settings },
  ];
  const nav = (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'20px 20px 12px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#2563eb,#06b6d4)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,color:'#fff'}}>N</div>
        <span style={{fontWeight:700,fontSize:15,background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>NorthLab</span>
      </div>
      <nav style={{flex:1,padding:'0 10px',display:'flex',flexDirection:'column',gap:2}}>
        {items.map(it => (
          <a key={it.id} className={`nav-item${page===it.id?' active':''}`}
            onClick={() => { setPage(it.id); setMobileOpen(false); }}>
            <Icon d={it.icon} size={15}/>{it.label}
          </a>
        ))}
      </nav>
      <div style={{padding:'12px 10px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',marginBottom:4}}>
          <div style={{position:'relative'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'#2563eb22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#3b82f6'}}>
              {(userName||'U').charAt(0).toUpperCase()}
            </div>
            <span style={{position:'absolute',bottom:0,right:0,width:8,height:8,background:'#10b981',borderRadius:'50%',border:'2px solid #080b14'}}/>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:600}}>{userName}</div>
            <div style={{fontSize:10,color:'#8891b8'}}>{role}</div>
          </div>
        </div>
        <a className="nav-item" onClick={onSignOut}>
          <Icon d={Icons.logout} size={15}/>Sign Out
        </a>
      </div>
    </div>
  );
  return (
    <>
      <aside style={{width:220,minHeight:'100vh',background:'#0d1120',borderRight:'1px solid #1e2540',position:'fixed',top:0,left:0,zIndex:40,display:'none'}} className="desktop-sidebar">
        {nav}
      </aside>
      {mobileOpen && <>
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:40}} onClick={() => setMobileOpen(false)}/>
        <aside style={{width:220,position:'fixed',top:0,left:0,height:'100%',background:'#0d1120',borderRight:'1px solid #1e2540',zIndex:50}}>
          {nav}
        </aside>
      </>}
    </>
  );
}

// ── Login page ───────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [name, setName] = useState('');
  const [role, setRole] = useState('Closer');
  const handleLogin = () => {
    if (!name.trim()) return alert('Enter your name');
    const u = { name: name.trim(), role };
    localStorage.setItem('nl_user', JSON.stringify(u));
    onLogin(u);
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:16,padding:32,width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{width:48,height:48,borderRadius:12,background:'linear-gradient(135deg,#2563eb,#06b6d4)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:22,color:'#fff',margin:'0 auto 12px'}}>N</div>
          <div style={{fontSize:20,fontWeight:700}}>NorthLab CRM</div>
          <div style={{fontSize:12,color:'#8891b8',marginTop:4}}>Enter your details to continue</div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Your Name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. lynx" onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Role</label>
          <select value={role} onChange={e=>setRole(e.target.value)}>
            <option>Setter</option><option>Closer</option><option>Admin</option>
          </select>
        </div>
        <button className="btn btn-primary" style={{width:'100%',padding:'10px'}} onClick={handleLogin}>Enter CRM</button>
      </div>
    </div>
  );
}

// ── Home page ────────────────────────────────────────────────────
function HomePage({ calls, installments, goals, goalLogs, setPage }) {
  const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; };
  const cc = calls.filter(c=>c.amount).reduce((s,c)=>s+parseFloat(c.amount||0),0)
           + installments.reduce((s,i)=>s+parseFloat(i.collected||0),0);
  const activeGoals = goals.filter(g=>!g.done);
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontSize:18,fontWeight:700}}>{greeting()}, {JSON.parse(localStorage.getItem('nl_user')||'{}').name||'User'}</div>
          <div style={{fontSize:11,color:'#8891b8',marginTop:2}}>{new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setPage('dashboard')}>Open CRM</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:16}}>
        <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
          <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:4}}>Total Cash Collected</div>
          <div style={{fontSize:22,fontWeight:700}}>{fmtMoney(cc)}</div>
        </div>
        <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
          <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:4}}>Active Goals</div>
          <div style={{fontSize:22,fontWeight:700}}>{activeGoals.length}</div>
        </div>
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600}}>Goals Overview</span>
          <button className="btn btn-secondary" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setPage('goals')}>View All</button>
        </div>
        {goals.length===0 ? <div style={{textAlign:'center',padding:'20px 0',color:'#8891b8',fontSize:13}}>No goals yet.</div> :
          goals.slice(0,6).map(g=>{
            const prog=goalLogs.filter(l=>l.goal_id===g.id).reduce((s,l)=>s+parseFloat(l.value||0),0);
            const pct=g.target?Math.min(100,Math.round(prog/g.target*100)):0;
            return <div key={g.id} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                <span style={{fontWeight:500}}>{g.name}{g.done&&<span className="badge badge-green" style={{marginLeft:6}}>Done</span>}</span>
                {g.target&&<span style={{color:'#8891b8'}}>{pct}%</span>}
              </div>
              {g.target&&<div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div>}
            </div>;
          })
        }
      </div>
    </div>
  );
}

// ── Dashboard page ───────────────────────────────────────────────
function DashboardPage({ calls, setCalls, installments, setInstallments, companies, setCompanies }) {
  const [activeComp, setActiveComp] = useState(null);
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const [outcomeOpen, setOutcomeOpen] = useState(false);
  const [closeOpen, setCloseOpen] = useState(false);
  const [notesOpen, setNotesOpen] = useState(false);
  const [notesCall, setNotesCall] = useState(null);
  const [payOpen, setPayOpen] = useState(false);
  const [payInst, setPayInst] = useState(null);
  const [newComp, setNewComp] = useState('');
  const [addCompOpen, setAddCompOpen] = useState(false);
  const [oForm, setOForm] = useState({ prospect:'', status:'Showed', notes:'' });
  const [cForm, setCForm] = useState({ prospect:'', type:'PIF', amount:'', plan:'', first_payment:'', commission:'', notes:'' });
  const [payForm, setPayForm] = useState({ amount:'', commission:'', notes:'' });

  const companyId = activeComp || (companies[0]?.id || null);
  const activeC = companies.find(c=>c.id===companyId);

  const fc = useMemo(()=>{
    let r = calls.filter(c=>c.company_id===companyId);
    if (filterFrom) r = r.filter(c=>new Date(c.created_date)>=new Date(filterFrom));
    if (filterTo) r = r.filter(c=>new Date(c.created_date)<=new Date(filterTo+'T23:59:59'));
    return r;
  },[calls,companyId,filterFrom,filterTo]);

  const fi = useMemo(()=>installments.filter(i=>i.company_id===companyId),[installments,companyId]);

  const kpis = useMemo(()=>{
    const closed = fc.filter(c=>['PIF','Installment'].includes(c.type));
    const cc = closed.filter(c=>c.type==='PIF').reduce((s,c)=>s+parseFloat(c.amount||0),0)
              + fi.reduce((s,i)=>s+parseFloat(i.collected||0),0);
    const pending = fi.reduce((s,i)=>s+(parseFloat(i.total_value||0)-parseFloat(i.collected||0)),0);
    const showed = fc.filter(c=>c.status==='Showed').length;
    const noshow = fc.filter(c=>c.status==='No Show').length;
    const resched = fc.filter(c=>c.status==='Rescheduled').length;
    const total = fc.length;
    return {
      cc, pending, closed:closed.length, booked:total,
      ccpc: closed.length>0?cc/closed.length:0,
      showPct: total>0?Math.round(showed/total*100):0,
      noshowPct: total>0?Math.round(noshow/total*100):0,
      reschedPct: total>0?Math.round(resched/total*100):0,
      pifPct: closed.length>0?Math.round(fc.filter(c=>c.type==='PIF').length/closed.length*100):0,
      customers: closed.length,
    };
  },[fc,fi]);

  const addOutcome = () => {
    if (!oForm.prospect.trim()) return alert('Enter prospect name');
    const rec = { id:db.uid(), company_id:companyId, prospect:oForm.prospect.trim(), status:oForm.status, notes:oForm.notes, created_date:db.now() };
    const updated = [...calls, rec];
    setCalls(updated); db.set('calls', updated);
    setOForm({ prospect:'', status:'Showed', notes:'' }); setOutcomeOpen(false);
  };

  const addClose = () => {
    if (!cForm.prospect.trim()) return alert('Enter prospect name');
    const rec = { id:db.uid(), company_id:companyId, prospect:cForm.prospect.trim(), status:cForm.type, type:cForm.type,
      amount:parseFloat(cForm.amount)||0, plan:cForm.plan, commission:parseFloat(cForm.commission)||0, notes:cForm.notes, created_date:db.now() };
    const updC = [...calls, rec]; setCalls(updC); db.set('calls', updC);
    if (cForm.type==='Installment') {
      const inst = { id:db.uid(), company_id:companyId, prospect:cForm.prospect.trim(), plan:cForm.plan,
        total_value:parseFloat(cForm.amount)||0, first_payment:parseFloat(cForm.first_payment)||0,
        collected:parseFloat(cForm.first_payment)||0, commission:parseFloat(cForm.commission)||0, notes:'', created_date:db.now() };
      const updI = [...installments, inst]; setInstallments(updI); db.set('installments', updI);
    }
    setCForm({ prospect:'', type:'PIF', amount:'', plan:'', first_payment:'', commission:'', notes:'' }); setCloseOpen(false);
  };

  const addPayment = () => {
    const amt = parseFloat(payForm.amount)||0;
    if (!amt) return alert('Enter amount');
    const updI = installments.map(i=>i.id===payInst.id?{...i,collected:parseFloat(i.collected||0)+amt,commission:parseFloat(i.commission||0)+parseFloat(payForm.commission||0)}:i);
    setInstallments(updI); db.set('installments', updI);
    const rec = { id:db.uid(), company_id:companyId, prospect:payInst.prospect, status:'Installment', type:'Installment',
      amount:amt, plan:payInst.plan, commission:parseFloat(payForm.commission)||0, notes:payForm.notes, created_date:db.now() };
    const updC = [...calls, rec]; setCalls(updC); db.set('calls', updC);
    setPayForm({ amount:'', commission:'', notes:'' }); setPayOpen(false);
  };

  const deleteCall = (id) => { if(!confirm('Delete?'))return; const u=calls.filter(c=>c.id!==id); setCalls(u); db.set('calls',u); };
  const deleteInst = (id) => { if(!confirm('Delete?'))return; const u=installments.filter(i=>i.id!==id); setInstallments(u); db.set('installments',u); };

  const addCompany = () => {
    if (!newComp.trim()) return;
    const c = { id:db.uid(), name:newComp.trim(), installment_tracking:false, commission_tracking:false };
    const u = [...companies, c]; setCompanies(u); db.set('companies', u);
    setNewComp(''); setAddCompOpen(false); setActiveComp(c.id);
  };

  const toggleComp = (field) => {
    if (!activeC) return;
    const u = companies.map(c=>c.id===activeC.id?{...c,[field]:!c[field]}:c);
    setCompanies(u); db.set('companies', u);
  };

  const kpiCard = (label, val) => (
    <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16,minWidth:0}}>
      <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:4}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{val}</div>
    </div>
  );

  const secCard = (label, val) => (
    <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:12}}>

// ── Notes modal ──────────────────────────────────────────────────
function NotesModal({ open, onClose, call, calls, setCalls }) {
  const [txt, setTxt] = useState('');
  if (!call) return null;
  const notes = JSON.parse(localStorage.getItem('nl_notes_'+call.id)||'[]');
  const saveNote = () => {
    if (!txt.trim()) return;
    const updated = [...notes, { id:db.uid(), text:txt.trim(), date:db.now() }];
    localStorage.setItem('nl_notes_'+call.id, JSON.stringify(updated));
    setTxt('');
    // force re-render
    onClose(); setTimeout(()=>{},0);
  };
  return (
    <Modal open={open} onClose={onClose} title={`Notes — ${call.prospect}`}>
      <div style={{maxHeight:200,overflowY:'auto',marginBottom:12,display:'flex',flexDirection:'column',gap:8}}>
        {notes.length===0?<div style={{color:'#8891b8',fontSize:12,textAlign:'center',padding:'12px 0'}}>No notes yet.</div>:
          notes.map(n=>(
            <div key={n.id} style={{background:'#080b14',borderRadius:8,padding:'8px 12px'}}>
              <div style={{fontSize:12}}>{n.text}</div>
              <div style={{fontSize:10,color:'#8891b8',marginTop:4}}>{fmtDate(n.date)}</div>
            </div>
          ))
        }
      </div>
      <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Add a note..." rows={3} style={{marginBottom:8}}/>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={saveNote}>Save Note</button>
    </Modal>
  );
}

// ── Revenue page ─────────────────────────────────────────────────
function RevenuePage({ calls }) {
  const [period, setPeriod] = useState('all');
  const [targetOpen, setTargetOpen] = useState(false);
  const [targetVal, setTargetVal] = useState('');
  const target = parseFloat(localStorage.getItem('nl_target')||'0');
  const periods = [['all','Total'],['today','Today'],['3d','3 Days'],['7d','7 Days'],['month','This Month'],['year','This Year']];

  const getFrom = (p) => {
    const now=new Date();
    if(p==='today') return new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(p==='3d'){const d=new Date(now);d.setDate(now.getDate()-3);return d;}
    if(p==='7d'){const d=new Date(now);d.setDate(now.getDate()-7);return d;}
    if(p==='month') return new Date(now.getFullYear(),now.getMonth(),1);
    if(p==='year') return new Date(now.getFullYear(),0,1);
    return null;
  };

  const filtered = useMemo(()=>{
    const from=getFrom(period); if(!from) return calls;
    return calls.filter(c=>new Date(c.created_date)>=from);
  },[calls,period]);

  const cc=filtered.filter(c=>c.amount).reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const closed=filtered.filter(c=>['PIF','Installment'].includes(c.type)).length;
  const comm=filtered.reduce((s,c)=>s+parseFloat(c.commission||0),0);
  const ccpc=closed>0?cc/closed:0;

  const chartData = useMemo(()=>{
    const sorted=[...filtered].filter(c=>c.amount).sort((a,b)=>new Date(a.created_date)-new Date(b.created_date));
    let cum=0;
    return sorted.map(c=>{cum+=parseFloat(c.amount||0);return{label:fmtDate(c.created_date),cc:+cum.toFixed(2)};});
  },[filtered]);

  const now=new Date();
  const monthCC=calls.filter(c=>c.amount&&new Date(c.created_date).getMonth()===now.getMonth()&&new Date(c.created_date).getFullYear()===now.getFullYear()).reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const targetPct=target>0?Math.min(100,Math.round(monthCC/target*100)):0;

  const saveTarget=()=>{localStorage.setItem('nl_target',parseFloat(targetVal)||0);setTargetOpen(false);};

  return (
    <div>
      <h1 style={{fontSize:18,fontWeight:700,marginBottom:16}}>Revenue <span style={{background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Overview</span></h1>
      <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
        {periods.map(([k,l])=>(
          <button key={k} onClick={()=>setPeriod(k)} style={{padding:'6px 14px',borderRadius:99,fontSize:12,fontWeight:500,cursor:'pointer',border:`1px solid ${period===k?'#2563eb':'#1e2540'}`,background:period===k?'#2563eb22':'#0d1120',color:period===k?'#3b82f6':'#8891b8',transition:'all 0.15s'}}>{l}</button>
        ))}
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,marginBottom:12}}>
        <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',marginBottom:4}}>Cash Collected</div>
        <div style={{fontSize:42,fontWeight:800,background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',marginBottom:16}}>{fmtMoney(cc)}</div>
        <div style={{height:200}}>
          {chartData.length>0?
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={chartData}>
                <XAxis dataKey="label" tick={{fill:'rgba(122,127,168,0.7)',fontSize:10}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:'rgba(122,127,168,0.7)',fontSize:10}} tickLine={false} axisLine={false} tickFormatter={v=>'$'+Number(v).toLocaleString()}/>
                <Tooltip contentStyle={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:8,fontSize:12}} formatter={v=>['$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2}),'CC']}/>
                <Area type="monotone" dataKey="cc" stroke="#2563eb" fill="rgba(37,99,235,0.1)" strokeWidth={2}/>
              </AreaChart>
            </ResponsiveContainer>
            :<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#8891b8',fontSize:13}}>No data for this period</div>
          }
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:12,marginBottom:16}}>
        {[['Closed Deals',closed],['CCPC',fmtMoney(ccpc)],['Commission',fmtMoney(comm)]].map(([l,v])=>(
          <div key={l} style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:14}}>
            <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',marginBottom:4}}>{l}</div>
            <div style={{fontSize:16,fontWeight:700}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600}}>Monthly Target</span>
          <button className="btn btn-secondary" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>{setTargetVal(target||'');setTargetOpen(true);}}>Edit</button>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:8}}>
          <span>{fmtMoney(monthCC)} collected this month</span>
          <span style={{color:'#8891b8'}}>Target: {fmtMoney(target)}</span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:targetPct+'%'}}/></div>
        <div style={{fontSize:11,color:'#8891b8',marginTop:6}}>{targetPct}% of target</div>
      </div>
      <Modal open={targetOpen} onClose={()=>setTargetOpen(false)} title="Monthly Target">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Target ($)</label><input type="number" min="0" value={targetVal} onChange={e=>setTargetVal(e.target.value)}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={saveTarget}>Save</button>
        </div>
      </Modal>
    </div>
  );
}

// ── Goals page ───────────────────────────────────────────────────
function GoalsPage({ goals, setGoals, goalLogs, setGoalLogs }) {
  const [goalOpen, setGoalOpen] = useState(false);
  const [progOpen, setProgOpen] = useState(false);
  const [progGoalId, setProgGoalId] = useState(null);
  const [form, setForm] = useState({ name:'', target:'', unit:'', notes:'' });
  const [progForm, setProgForm] = useState({ value:'', note:'' });

  const addGoal = () => {
    if (!form.name.trim()) return alert('Enter goal name');
    const g = { id:db.uid(), name:form.name.trim(), target:parseFloat(form.target)||null, unit:form.unit.trim(), notes:form.notes.trim(), done:false, created_date:db.now() };
    const u=[...goals,g]; setGoals(u); db.set('goals',u);
    setForm({name:'',target:'',unit:'',notes:''}); setGoalOpen(false);
  };

  const logProg = () => {
    const val=parseFloat(progForm.value)||0; if(!val) return alert('Enter value');
    const l={id:db.uid(),goal_id:progGoalId,value:val,note:progForm.note,created_date:db.now()};
    const u=[...goalLogs,l]; setGoalLogs(u); db.set('goalLogs',u);
    setProgForm({value:'',note:''}); setProgOpen(false);
  };

  const markDone = (id, done) => { const u=goals.map(g=>g.id===id?{...g,done}:g); setGoals(u); db.set('goals',u); };
  const delGoal = (id) => { if(!confirm('Delete?'))return; const u=goals.filter(g=>g.id!==id); setGoals(u); db.set('goals',u); };

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <h1 style={{fontSize:18,fontWeight:700,margin:0}}>Goals <span style={{background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Tracker</span></h1>
        <button className="btn btn-primary" onClick={()=>setGoalOpen(true)}><Icon d={Icons.plus} size={13}/>New Goal</button>
      </div>
      {goals.length===0?<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:32,textAlign:'center',color:'#8891b8',fontSize:13}}>No goals yet.</div>:
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12}}>
          {goals.map(g=>{
            const logs=goalLogs.filter(l=>l.goal_id===g.id);
            const prog=logs.reduce((s,l)=>s+parseFloat(l.value||0),0);
            const pct=g.target?Math.min(100,Math.round(prog/g.target*100)):0;
            return (
              <div key={g.id} style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16,opacity:g.done?0.5:1}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{g.name}{g.done&&<span className="badge badge-green" style={{marginLeft:6}}>Done</span>}</div>
                    {g.notes&&<div style={{fontSize:11,color:'#8891b8',marginTop:2}}>{g.notes}</div>}
                  </div>
                  <div style={{display:'flex',gap:4}}>
                    {!g.done&&<button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{setProgGoalId(g.id);setProgOpen(true);}}>+Log</button>}
                    <button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>markDone(g.id,!g.done)}>{g.done?'Reopen':'Done'}</button>
                    <button className="btn btn-danger" style={{padding:'3px 7px'}} onClick={()=>delGoal(g.id)}><Icon d={Icons.trash} size={12}/></button>
                  </div>
                </div>
                {g.target&&<>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#8891b8',marginBottom:4}}>
                    <span>{prog.toLocaleString()} {g.unit||''}</span>
                    <span>/ {parseFloat(g.target).toLocaleString()} {g.unit||''}</span>
                  </div>
                  <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div>
                  <div style={{fontSize:11,color:'#8891b8',marginTop:4}}>{pct}% complete</div>
                </>}
              </div>
            );
          })}
        </div>
      }
      <Modal open={goalOpen} onClose={()=>setGoalOpen(false)} title="New Goal">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Goal Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Target</label><input type="number" value={form.target} onChange={e=>setForm({...form,target:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Unit</label><input value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} placeholder="$, calls..."/></div>
          </div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={2}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addGoal}>Create Goal</button>
        </div>
      </Modal>
      <Modal open={progOpen} onClose={()=>setProgOpen(false)} title="Log Progress">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Amount</label><input type="number" value={progForm.value} onChange={e=>setProgForm({...progForm,value:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Note</label><input value={progForm.note} onChange={e=>setProgForm({...progForm,note:e.target.value})} placeholder="Optional"/></div>
          </div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={logProg}>Log Progress</button>
        </div>
      </Modal>
    </div>
  );
}

// ── Settings page ────────────────────────────────────────────────
function SettingsPage({ user, setUser }) {
  const [name, setName] = useState(user?.name||'');
  const [role, setRole] = useState(user?.role||'Closer');
  const save = () => { const u={...user,name,role}; setUser(u); localStorage.setItem('nl_user',JSON.stringify(u)); alert('Saved!'); };
  return (
    <div>
      <h1 style={{fontSize:18,fontWeight:700,marginBottom:20}}>Settings</h1>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,maxWidth:400}}>
        <div style={{fontSize:11,color:'#8891b8',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:16}}>Profile</div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Display Name</label><input value={name} onChange={e=>setName(e.target.value)}/></div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Role</label>
            <select value={role} onChange={e=>setRole(e.target.value)}>
              <option>Setter</option><option>Closer</option><option>Admin</option>
            </select>
          </div>
          <button className="btn btn-primary" style={{padding:10}} onClick={save}>Save Changes</button>
        </div>
      </div>
    </div>
  );
}

// ── App root ─────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('home');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [calls, setCalls] = useState(()=>db.get('calls'));
  const [installments, setInstallments] = useState(()=>db.get('installments'));
  const [companies, setCompanies] = useState(()=>db.get('companies'));
  const [goals, setGoals] = useState(()=>db.get('goals'));
  const [goalLogs, setGoalLogs] = useState(()=>db.get('goalLogs'));

  useEffect(()=>{
    const u = localStorage.getItem('nl_user');
    if (u) try { setUser(JSON.parse(u)); } catch {}
  },[]);

  const signOut = () => { localStorage.removeItem('nl_user'); setUser(null); };

  if (!user) return <LoginPage onLogin={setUser}/>;

  const pages = { home: <HomePage calls={calls} installments={installments} goals={goals} goalLogs={goalLogs} setPage={setPage}/>,
    dashboard: <DashboardPage calls={calls} setCalls={setCalls} installments={installments} setInstallments={setInstallments} companies={companies} setCompanies={setCompanies}/>,
    revenue: <RevenuePage calls={calls}/>,
    goals: <GoalsPage goals={goals} setGoals={setGoals} goalLogs={goalLogs} setGoalLogs={setGoalLogs}/>,
    settings: <SettingsPage user={user} setUser={setUser}/>,
  };

  return (
    <>
      <style>{`.desktop-sidebar{display:flex!important;}`}</style>
      <Sidebar page={page} setPage={setPage} userName={user.name} role={user.role} onSignOut={signOut} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      {/* Mobile hamburger */}
      <button onClick={()=>setMobileOpen(true)} style={{position:'fixed',top:12,left:12,zIndex:35,background:'#0d1120',border:'1px solid #1e2540',borderRadius:8,padding:'6px 8px',cursor:'pointer',display:'none'}} className="mobile-menu-btn">
        <Icon d={Icons.menu} size={18} color="#8891b8"/>
      </button>
      <style>{`@media(max-width:767px){.desktop-sidebar{display:none!important;}.mobile-menu-btn{display:flex!important;}}`}</style>
      <main style={{marginLeft:0,padding:'20px 16px'}} className="main-content">
        <style>{`@media(min-width:768px){.main-content{margin-left:220px;padding:20px 24px;}}`}</style>
        {pages[page]}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
