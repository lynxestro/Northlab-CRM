<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#080b14"/>
<title>NorthLab CRM</title>
<!-- FIXED: switched from unpkg → jsdelivr (reliable on any domain/hosting) -->
<!-- FIXED: removed Tailwind CDN (was unused & slowing load) -->
<!-- FIXED: correct script load order -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080b14;color:#eef0ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#1e2540;border-radius:99px}
input,select,textarea{background:#0d1120;color:#eef0ff;border:1px solid #1e2540;border-radius:8px;padding:6px 10px;outline:none;width:100%;box-sizing:border-box;font-size:13px;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#2563eb}
select option{background:#0d1120}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#0d1120;border:1px solid #1e2540;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
.btn-primary{background:linear-gradient(to right,#2563eb,#06b6d4);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:#0d1120;color:#8891b8;border:1px solid #1e2540}
.btn-secondary:hover{color:#eef0ff;border-color:#2563eb66}
.btn-danger{background:#991b1b22;color:#ef4444;border:1px solid #ef444433}
.btn-danger:hover{background:#ef444433}
.badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.badge-green{background:#05966920;color:#10b981}
.badge-red{background:#ef444420;color:#ef4444}
.badge-yellow{background:#f59e0b20;color:#f59e0b}
.badge-blue{background:#2563eb20;color:#60a5fa}
.badge-cyan{background:#06b6d420;color:#06b6d4}
.badge-gray{background:#1e254033;color:#8891b8}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:#8891b8;cursor:pointer;transition:all .15s;border:none;background:transparent;width:100%;text-align:left;position:relative}
.nav-item:hover{background:#1e254044;color:#eef0ff}
.nav-item.active{background:#2563eb22;color:#3b82f6}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2.5px;background:linear-gradient(to bottom,#2563eb,#06b6d4);border-radius:0 3px 3px 0}
.progress-bar{height:5px;background:#1e2540;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(to right,#2563eb,#06b6d4);border-radius:99px;transition:width .3s}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:600;color:#8891b8;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid #1e2540;background:#080b14}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid #1e254033;vertical-align:middle}
tr:hover td{background:#1e254022}
/* Loading screen */
#app-loading{position:fixed;inset:0;background:#080b14;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.load-spin{width:28px;height:28px;border:3px solid #1e2540;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeToast{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
/* Responsive */
@media(min-width:768px){
  .desktop-sidebar{display:flex!important}
  .mobile-menu-btn{display:none!important}
  .main-content{margin-left:220px!important;padding:20px 24px!important}
}
@media(max-width:767px){
  .desktop-sidebar{display:none!important}
  .mobile-menu-btn{display:flex!important}
  .main-content{margin-left:0!important;padding:58px 14px 20px!important}
}
</style>
</head>
<body>

<!-- Loading screen shown until React mounts -->
<div id="app-loading">
  <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff">N</div>
  <div class="load-spin"></div>
  <div style="font-size:13px;color:#8891b8">Loading NorthLab CRM…</div>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

/* ── LocalStorage DB ── */
const db = {
  get:(k,d=[])=>{try{const v=localStorage.getItem('nl_'+k);return v!=null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem('nl_'+k,JSON.stringify(v));}catch{}},
  uid:()=>Math.random().toString(36).slice(2)+Date.now().toString(36),
  now:()=>new Date().toISOString(),
};

/* ── Utils ── */
const fmtMoney=(n)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=(s)=>s?new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const gradStyle={background:'linear-gradient(135deg,#2563eb,#06b6d4)'};
const gradText={background:'linear-gradient(to right,#3b82f6,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'};

/* ── Icons ── */
const Ic=({d,size=15,color='currentColor'})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);
const I={
  home:"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",
  dash:"M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z",
  rev:"M12 1v22 M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6",
  goal:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 8v4l3 3",
  cfg:"M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z",
  out:"M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9",
  plus:"M12 5v14 M5 12h14",
  trash:"M3 6h18 M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6 M10 11v6 M14 11v6 M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2",
  menu:"M3 12h18 M3 6h18 M3 18h18",
  x:"M18 6L6 18 M6 6l12 12",
};

/* ── Toast system ── */
let _addToast=null;
function ToastHost(){
  const [list,setList]=useState([]);
  _addToast=(msg,type='ok')=>{
    const id=Date.now();
    setList(l=>[...l,{id,msg,type}]);
    setTimeout(()=>setList(l=>l.filter(x=>x.id!==id)),3200);
  };
  if(!list.length)return null;
  return(
    <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
      {list.map(t=>(
        <div key={t.id} style={{padding:'10px 16px',background:'#0d1120',border:`1px solid ${t.type==='ok'?'#10b98155':'#ef444455'}`,borderRadius:11,fontSize:13,fontWeight:500,color:t.type==='ok'?'#10b981':'#ef4444',boxShadow:'0 8px 24px rgba(0,0,0,.5)',animation:'fadeToast .25s ease'}}>
          {t.type==='ok'?'✓':'✕'} {t.msg}
        </div>
      ))}
    </div>
  );
}
const toast=(msg,type='ok')=>_addToast?.(msg,type);

/* ── Status badge ── */
const SBadge=({s})=>{
  const m={'PIF':'badge-cyan','Installment':'badge-blue','Showed':'badge-green','No Show':'badge-red','Rescheduled':'badge-yellow','Cancelled':'badge-red','Offered':'badge-blue'};
  return <span className={`badge ${m[s]||'badge-gray'}`}>{s||'—'}</span>;
};

/* ── Toggle ── */
const Toggle=({on,onClick})=>(
  <div onClick={onClick} style={{width:36,height:20,borderRadius:99,background:on?'#2563eb':'#1e2540',position:'relative',cursor:'pointer',transition:'background .2s',flexShrink:0}}>
    <div style={{position:'absolute',top:2,left:on?18:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left .2s'}}/>
  </div>
);

/* ── Modal ── */
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
          <span style={{fontWeight:700,fontSize:15}}>{title}</span>
          <button className="btn btn-secondary" style={{padding:'3px 8px',fontSize:16}} onClick={onClose}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ── Sidebar ── */
function Sidebar({page,setPage,user,onSignOut,mobileOpen,setMobileOpen}){
  const nav=[
    {id:'home',label:'Home',icon:I.home},
    {id:'dashboard',label:'Dashboard',icon:I.dash},
    {id:'revenue',label:'Revenue',icon:I.rev},
    {id:'goals',label:'Goals',icon:I.goal},
    {id:'settings',label:'Settings',icon:I.cfg},
  ];
  const go=(id)=>{setPage(id);setMobileOpen(false);};
  const Content=(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'18px 16px 14px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid #1e2540',flexShrink:0}}>
        <div style={{width:30,height:30,borderRadius:8,...gradStyle,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14,color:'#fff',flexShrink:0}}>N</div>
        <span style={{fontWeight:700,fontSize:14,...gradText}}>NorthLab</span>
      </div>
      <nav style={{flex:1,padding:'8px 8px',display:'flex',flexDirection:'column',gap:1,overflowY:'auto'}}>
        {nav.map(it=>(
          <button key={it.id} className={`nav-item${page===it.id?' active':''}`} onClick={()=>go(it.id)}>
            <div style={{width:30,height:30,borderRadius:8,background:page===it.id?'rgba(37,99,235,.2)':'rgba(30,37,64,.4)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <Ic d={it.icon} size={14}/>
            </div>
            {it.label}
          </button>
        ))}
      </nav>
      <div style={{padding:'10px 8px',borderTop:'1px solid #1e2540',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 12px',marginBottom:4}}>
          <div style={{position:'relative',flexShrink:0}}>
            <div style={{width:28,height:28,borderRadius:'50%',...gradStyle,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff'}}>
              {(user?.name||'U').charAt(0).toUpperCase()}
            </div>
            <span style={{position:'absolute',bottom:0,right:0,width:8,height:8,background:'#10b981',borderRadius:'50%',border:'2px solid #0d1120'}}/>
          </div>
          <div style={{overflow:'hidden'}}>
            <div style={{fontSize:12,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user?.name}</div>
            <div style={{fontSize:10,color:'#8891b8'}}>{user?.role}</div>
          </div>
        </div>
        <button className="nav-item" onClick={onSignOut} style={{color:'#8891b8'}}>
          <div style={{width:30,height:30,borderRadius:8,background:'rgba(239,68,68,.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#ef4444'}}>
            <Ic d={I.out} size={14}/>
          </div>
          <span style={{color:'#ef4444'}}>Sign Out</span>
        </button>
      </div>
    </div>
  );
  return(
    <>
      <aside className="desktop-sidebar" style={{width:220,minHeight:'100vh',background:'#0d1120',borderRight:'1px solid #1e2540',position:'fixed',top:0,left:0,zIndex:40,flexDirection:'column',display:'none'}}>
        {Content}
      </aside>
      {mobileOpen&&<>
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:40}} onClick={()=>setMobileOpen(false)}/>
        <aside style={{width:220,position:'fixed',top:0,left:0,height:'100%',background:'#0d1120',borderRight:'1px solid #1e2540',zIndex:50,display:'flex',flexDirection:'column'}}>
          {Content}
        </aside>
      </>}
    </>
  );
}

/* ── Login ── */
function Login({onLogin}){
  const [name,setName]=useState('');
  const [role,setRole]=useState('Closer');
  const go=()=>{
    if(!name.trim()){toast('Enter your name','err');return;}
    const u={name:name.trim(),role};db.set('user',u);onLogin(u);
  };
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:16,padding:32,width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{width:48,height:48,borderRadius:12,...gradStyle,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:22,color:'#fff',margin:'0 auto 12px'}}>N</div>
          <div style={{fontSize:20,fontWeight:700}}>NorthLab CRM</div>
          <div style={{fontSize:12,color:'#8891b8',marginTop:4}}>Enter your details to continue</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Your Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. lynx" onKeyDown={e=>e.key==='Enter'&&go()}/>
          </div>
          <div>
            <label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Role</label>
            <select value={role} onChange={e=>setRole(e.target.value)}>
              <option>Setter</option><option>Closer</option><option>Admin</option>
            </select>
          </div>
          <button className="btn btn-primary" style={{width:'100%',padding:'10px'}} onClick={go}>Enter CRM</button>
        </div>
      </div>
    </div>
  );
}

/* ── Home ── */
function Home({calls,installments,goals,goalLogs,setPage,user}){
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const cc=calls.filter(c=>c.amount).reduce((s,c)=>s+parseFloat(c.amount||0),0)
          +installments.reduce((s,i)=>s+parseFloat(i.collected||0),0);
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22,flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontSize:18,fontWeight:700}}>{greet}, {user?.name||'User'}</div>
          <div style={{fontSize:11,color:'#8891b8',marginTop:2}}>{new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setPage('dashboard')}>Open CRM</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:16}}>
        {[['Total Cash Collected',fmtMoney(cc)],['Active Goals',goals.filter(g=>!g.done).length]].map(([l,v])=>(
          <div key={l} style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
            <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>{l}</div>
            <div style={{fontSize:22,fontWeight:700,...gradText}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600}}>Goals Overview</span>
          <button className="btn btn-secondary" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setPage('goals')}>View All</button>
        </div>
        {goals.length===0
          ?<div style={{textAlign:'center',padding:'20px 0',color:'#8891b8',fontSize:13}}>No goals yet.</div>
          :goals.slice(0,6).map(g=>{
            const prog=goalLogs.filter(l=>l.goal_id===g.id).reduce((s,l)=>s+parseFloat(l.value||0),0);
            const pct=g.target?Math.min(100,Math.round(prog/g.target*100)):0;
            return(
              <div key={g.id} style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                  <span style={{fontWeight:500}}>{g.name}{g.done&&<span className="badge badge-green" style={{marginLeft:6}}>Done</span>}</span>
                  {g.target&&<span style={{color:'#8891b8'}}>{pct}%</span>}
                </div>
                {g.target&&<div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div>}
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

/* ── Dashboard ── */
function Dashboard({calls,setCalls,installments,setInstallments,companies,setCompanies}){
  const [activeComp,setActiveComp]=useState(()=>companies[0]?.id||null);
  const [fFrom,setFFrom]=useState('');
  const [fTo,setFTo]=useState('');
  const [outcomeOpen,setOutcomeOpen]=useState(false);
  const [closeOpen,setCloseOpen]=useState(false);
  const [notesOpen,setNotesOpen]=useState(false);
  const [notesCall,setNotesCall]=useState(null);
  const [payOpen,setPayOpen]=useState(false);
  const [payInst,setPayInst]=useState(null);
  const [addCoOpen,setAddCoOpen]=useState(false);
  const [coName,setCoName]=useState('');
  const [oF,setOF]=useState({prospect:'',status:'Showed',notes:''});
  const [cF,setCF]=useState({prospect:'',type:'PIF',amount:'',plan:'',total_value:'',first_payment:'',commission:'',notes:''});
  const [pF,setPF]=useState({amount:'',commission:'',notes:''});

  const compId=activeComp||companies[0]?.id||null;
  const co=companies.find(c=>c.id===compId);

  const fc=useMemo(()=>{
    let r=compId?calls.filter(c=>c.company_id===compId):calls;
    if(fFrom)r=r.filter(c=>new Date(c.created_date)>=new Date(fFrom));
    if(fTo)r=r.filter(c=>new Date(c.created_date)<=new Date(fTo+'T23:59:59'));
    return r;
  },[calls,compId,fFrom,fTo]);

  const fi=useMemo(()=>compId?installments.filter(i=>i.company_id===compId):installments,[installments,compId]);

  const kpis=useMemo(()=>{
    const pifC=fc.filter(c=>c.type==='PIF');
    const closed=fc.filter(c=>['PIF','Installment'].includes(c.type));
    const cc=pifC.reduce((s,c)=>s+parseFloat(c.amount||0),0)+fi.reduce((s,i)=>s+parseFloat(i.collected||0),0);
    const pending=fi.reduce((s,i)=>s+Math.max(0,parseFloat(i.total_value||0)-parseFloat(i.collected||0)),0);
    const showed=fc.filter(c=>c.status==='Showed').length;
    const noshow=fc.filter(c=>c.status==='No Show').length;
    const resched=fc.filter(c=>c.status==='Rescheduled').length;
    const tot=fc.filter(c=>['Showed','No Show','Rescheduled','Cancelled'].includes(c.status)).length;
    const cust=[...new Set(fc.filter(c=>c.prospect&&c.amount).map(c=>c.prospect))].length;
    return{cc,pending,closed:closed.length,booked:fc.length,
      ccpc:closed.length>0?cc/closed.length:0,
      showPct:tot>0?Math.round(showed/tot*100):0,
      noshowPct:tot>0?Math.round(noshow/tot*100):0,
      reschedPct:tot>0?Math.round(resched/tot*100):0,
      pifPct:closed.length>0?Math.round(pifC.length/closed.length*100):0,
      customers:cust};
  },[fc,fi]);

  const addOutcome=()=>{
    if(!oF.prospect.trim()){toast('Enter prospect name','err');return;}
    const r={id:db.uid(),company_id:compId,prospect:oF.prospect.trim(),status:oF.status,notes:oF.notes,created_date:db.now()};
    const u=[...calls,r];setCalls(u);db.set('calls',u);
    setOF({prospect:'',status:'Showed',notes:''});setOutcomeOpen(false);toast('Outcome logged');
  };

  const addClose=()=>{
    if(!cF.prospect.trim()){toast('Enter prospect name','err');return;}
    const amt=parseFloat(cF.amount)||0;
    const r={id:db.uid(),company_id:compId,prospect:cF.prospect.trim(),status:cF.type,type:cF.type,
      amount:amt,plan:cF.plan,commission:parseFloat(cF.commission)||0,notes:cF.notes,created_date:db.now()};
    const uC=[...calls,r];setCalls(uC);db.set('calls',uC);
    if(cF.type==='Installment'){
      const tv=parseFloat(cF.total_value)||amt;
      const fp=parseFloat(cF.first_payment)||amt;
      const inst={id:db.uid(),company_id:compId,prospect:cF.prospect.trim(),plan:cF.plan,
        total_value:tv,first_payment:fp,collected:fp,commission:parseFloat(cF.commission)||0,created_date:db.now()};
      const uI=[...installments,inst];setInstallments(uI);db.set('installments',uI);
    }
    setCF({prospect:'',type:'PIF',amount:'',plan:'',total_value:'',first_payment:'',commission:'',notes:''});
    setCloseOpen(false);toast('Close logged');
  };

  const addPay=()=>{
    const amt=parseFloat(pF.amount)||0;
    if(!amt){toast('Enter amount','err');return;}
    const uI=installments.map(i=>i.id===payInst.id?{...i,collected:parseFloat(i.collected||0)+amt,commission:parseFloat(i.commission||0)+parseFloat(pF.commission||0)}:i);
    setInstallments(uI);db.set('installments',uI);
    const r={id:db.uid(),company_id:compId,prospect:payInst.prospect,status:'Installment',type:'Installment',
      amount:amt,plan:payInst.plan,commission:parseFloat(pF.commission)||0,notes:pF.notes,created_date:db.now()};
    const uC=[...calls,r];setCalls(uC);db.set('calls',uC);
    setPF({amount:'',commission:'',notes:''});setPayOpen(false);toast('Payment added');
  };

  const delCall=(id)=>{if(!confirm('Delete this call?'))return;const u=calls.filter(c=>c.id!==id);setCalls(u);db.set('calls',u);toast('Deleted');};
  const delInst=(id)=>{if(!confirm('Delete this plan?'))return;const u=installments.filter(i=>i.id!==id);setInstallments(u);db.set('installments',u);toast('Deleted');};
  const addCo=()=>{
    if(!coName.trim())return;
    const c={id:db.uid(),name:coName.trim(),installment_tracking:false,commission_tracking:false};
    const u=[...companies,c];setCompanies(u);db.set('companies',u);
    setCoName('');setAddCoOpen(false);setActiveComp(c.id);toast('Company added');
  };
  const delCo=(id)=>{
    if(!confirm('Delete company?'))return;
    const u=companies.filter(c=>c.id!==id);setCompanies(u);db.set('companies',u);
    if(activeComp===id)setActiveComp(u[0]?.id||null);toast('Deleted');
  };
  const toggleCo=(field)=>{
    if(!co)return;
    const u=companies.map(c=>c.id===compId?{...c,[field]:!c[field]}:c);
    setCompanies(u);db.set('companies',u);
  };

  const KCard=({label,val})=>(
    <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16,minWidth:0,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,...gradStyle,opacity:.04}}/>
      <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,...gradText}}>{val}</div>
    </div>
  );
  const SCard=({label,val})=>(
    <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:12}}>
      <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}}>{label}</div>
      <div style={{fontSize:15,fontWeight:700}}>{val}</div>
    </div>
  );

  return(
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <h1 style={{fontSize:18,fontWeight:700,margin:0}}>Dashboard <span style={gradText}>CRM</span></h1>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-secondary" onClick={()=>setOutcomeOpen(true)}>Log Outcome</button>
          <button className="btn btn-primary" onClick={()=>setCloseOpen(true)}><Ic d={I.plus} size={13}/>Log Close</button>
        </div>
      </div>

      {/* Company row */}
      <div style={{display:'flex',gap:7,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        {companies.map(c=>{
          const active=(activeComp||companies[0]?.id)===c.id;
          return(
            <div key={c.id} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 8px 5px 13px',borderRadius:99,fontSize:12,fontWeight:500,border:`1px solid ${active?'#2563eb':'#1e2540'}`,background:active?'rgba(37,99,235,.15)':'#0d1120',color:active?'#60a5fa':'#8891b8',transition:'all .15s'}}>
              <span style={{cursor:'pointer'}} onClick={()=>setActiveComp(c.id)}>{c.name}</span>
              <button onClick={()=>delCo(c.id)} style={{background:'none',border:'none',color:'inherit',cursor:'pointer',opacity:.5,fontSize:17,lineHeight:1,padding:'0 2px',display:'flex',alignItems:'center'}}>&times;</button>
            </div>
          );
        })}
        <button className="btn btn-secondary" style={{width:30,height:30,padding:0,borderRadius:'50%',fontSize:18}} onClick={()=>setAddCoOpen(true)}>+</button>
      </div>

      {/* Toggles */}
      {co&&<div style={{display:'flex',gap:16,marginBottom:14,flexWrap:'wrap'}}>
        {[['installment_tracking','Installment Tracking'],['commission_tracking','Commission Tracking']].map(([f,l])=>(
          <label key={f} style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#8891b8',cursor:'pointer'}}>
            <Toggle on={!!co[f]} onClick={()=>toggleCo(f)}/>{l}
          </label>
        ))}
      </div>}

      {/* Date filter */}
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <input type="date" value={fFrom} onChange={e=>setFFrom(e.target.value)} style={{width:'auto'}}/>
        <span style={{color:'#8891b8',fontSize:12}}>to</span>
        <input type="date" value={fTo} onChange={e=>setFTo(e.target.value)} style={{width:'auto'}}/>
        <button className="btn btn-secondary" style={{fontSize:12}} onClick={()=>{setFFrom('');setFTo('');}}>Clear</button>
      </div>

      {/* Stat bar */}
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:'10px 16px',marginBottom:16,display:'flex',gap:20,flexWrap:'wrap'}}>
        {[['CC',fmtMoney(kpis.cc)],['Closed',kpis.closed],['Pending',fmtMoney(kpis.pending)],['Calls',kpis.booked],['Show%',kpis.showPct+'%'],['Customers',kpis.customers]].map(([l,v])=>(
          <div key={l}><div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em'}}>{l}</div><div style={{fontSize:14,fontWeight:700}}>{v}</div></div>
        ))}
      </div>

      {/* Hero KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12,marginBottom:12}}>
        <KCard label="Cash Collected" val={fmtMoney(kpis.cc)}/>
        <KCard label="Closed Deals" val={kpis.closed}/>
        <KCard label="Pending" val={fmtMoney(kpis.pending)}/>
        <KCard label="Booked Calls" val={kpis.booked}/>
      </div>

      {/* Sec KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))',gap:10,marginBottom:20}}>
        <SCard label="CCPC" val={fmtMoney(kpis.ccpc)}/>
        <SCard label="Show %" val={kpis.showPct+'%'}/>
        <SCard label="No Show %" val={kpis.noshowPct+'%'}/>
        <SCard label="Resched %" val={kpis.reschedPct+'%'}/>
        <SCard label="PIF Rate" val={kpis.pifPct+'%'}/>
        <SCard label="Customers" val={kpis.customers}/>
      </div>

      {/* Installments */}
      {co?.installment_tracking&&<div style={{marginBottom:20}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Installment Plans</div>
        {fi.length===0
          ?<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,textAlign:'center',color:'#8891b8',fontSize:13}}>No plans yet. Log a close with type "Installment".</div>
          :<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,overflowX:'auto'}}>
            <table>
              <thead><tr><th>Prospect</th><th>Plan</th><th>Collected</th><th>Pending</th><th>Progress</th><th>Actions</th></tr></thead>
              <tbody>
                {fi.map(i=>{
                  const pct=i.total_value>0?Math.min(100,Math.round(i.collected/i.total_value*100)):0;
                  return(
                    <tr key={i.id}>
                      <td style={{fontWeight:500}}>{i.prospect||'—'}</td>
                      <td style={{color:'#8891b8'}}>{i.plan||'—'}</td>
                      <td style={{color:'#10b981'}}>{fmtMoney(i.collected)}</td>
                      <td style={{color:'#f59e0b'}}>{fmtMoney(Math.max(0,(i.total_value||0)-(i.collected||0)))}</td>
                      <td style={{minWidth:80}}><div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div><div style={{fontSize:10,color:'#8891b8',marginTop:2}}>{pct}%</div></td>
                      <td style={{whiteSpace:'nowrap'}}>
                        <button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px',marginRight:4}} onClick={()=>{setPayInst(i);setPayOpen(true);}}>+Pay</button>
                        <button className="btn btn-danger" style={{padding:'3px 8px',fontSize:14}} onClick={()=>delInst(i.id)}>&times;</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        }
      </div>}

      {/* Calls table */}
      <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Recent Calls</div>
      {fc.length===0
        ?<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,textAlign:'center',color:'#8891b8',fontSize:13}}>No calls logged yet.</div>
        :<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,overflowX:'auto'}}>
          <table>
            <thead><tr><th>Prospect</th><th>Date</th><th>Status</th><th>Amount</th><th>Type</th><th>Notes</th><th></th></tr></thead>
            <tbody>
              {[...fc].reverse().map(c=>(
                <tr key={c.id}>
                  <td style={{fontWeight:500}}>{c.prospect||'—'}</td>
                  <td style={{color:'#8891b8',fontSize:11}}>{fmtDate(c.created_date)}</td>
                  <td><SBadge s={c.status}/></td>
                  <td>{c.amount?fmtMoney(c.amount):'—'}</td>
                  <td>{c.type?<span className={`badge ${c.type==='PIF'?'badge-cyan':'badge-blue'}`}>{c.type}</span>:'—'}</td>
                  <td><button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{setNotesCall(c);setNotesOpen(true);}}>Notes</button></td>
                  <td><button className="btn btn-danger" style={{padding:'3px 8px',fontSize:14}} onClick={()=>delCall(c.id)}>&times;</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      }

      {/* Modals */}
      <Modal open={outcomeOpen} onClose={()=>setOutcomeOpen(false)} title="Log Outcome">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Prospect Name</label><input value={oF.prospect} onChange={e=>setOF({...oF,prospect:e.target.value})} placeholder="Full name"/></div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Status</label>
            <select value={oF.status} onChange={e=>setOF({...oF,status:e.target.value})}>
              {['Showed','No Show','Rescheduled','Cancelled','Offered'].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Notes</label><textarea value={oF.notes} onChange={e=>setOF({...oF,notes:e.target.value})} rows={3}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addOutcome}>Save Outcome</button>
        </div>
      </Modal>

      <Modal open={closeOpen} onClose={()=>setCloseOpen(false)} title="Log Close">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Prospect</label><input value={cF.prospect} onChange={e=>setCF({...cF,prospect:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Plan</label><input value={cF.plan} onChange={e=>setCF({...cF,plan:e.target.value})}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Amount ($)</label><input type="number" value={cF.amount} onChange={e=>setCF({...cF,amount:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Type</label>
              <select value={cF.type} onChange={e=>setCF({...cF,type:e.target.value})}>
                <option>PIF</option><option>Installment</option>
              </select>
            </div>
          </div>
          {cF.type==='Installment'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Total Plan Value ($)</label><input type="number" value={cF.total_value} onChange={e=>setCF({...cF,total_value:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>First Payment ($)</label><input type="number" value={cF.first_payment} onChange={e=>setCF({...cF,first_payment:e.target.value})}/></div>
          </div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Commission ($)</label><input type="number" value={cF.commission} onChange={e=>setCF({...cF,commission:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Notes</label><input value={cF.notes} onChange={e=>setCF({...cF,notes:e.target.value})} placeholder="Optional"/></div>
          </div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addClose}>Save Close</button>
        </div>
      </Modal>

      <Modal open={payOpen} onClose={()=>setPayOpen(false)} title={`Add Payment — ${payInst?.prospect||''}`}>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Amount ($)</label><input type="number" value={pF.amount} onChange={e=>setPF({...pF,amount:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Commission ($)</label><input type="number" value={pF.commission} onChange={e=>setPF({...pF,commission:e.target.value})}/></div>
          </div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Notes</label><input value={pF.notes} onChange={e=>setPF({...pF,notes:e.target.value})}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addPay}>Save Payment</button>
        </div>
      </Modal>

      <NotesModal open={notesOpen} onClose={()=>setNotesOpen(false)} call={notesCall}/>

      <Modal open={addCoOpen} onClose={()=>setAddCoOpen(false)} title="Add Company">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Company Name</label><input value={coName} onChange={e=>setCoName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCo()}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addCo}>Add Company</button>
        </div>
      </Modal>
    </div>
  );
}

/* ── Notes Modal ── */
function NotesModal({open,onClose,call}){
  const [txt,setTxt]=useState('');
  const [tick,setTick]=useState(0);
  if(!call)return null;
  const key='nl_notes_'+call.id;
  const notes=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}};
  const save=()=>{
    if(!txt.trim()){toast('Enter a note','err');return;}
    const n={id:db.uid(),text:txt.trim(),date:db.now()};
    localStorage.setItem(key,JSON.stringify([...notes(),n]));
    setTxt('');setTick(t=>t+1);toast('Note saved');
  };
  const list=notes();
  return(
    <Modal open={open} onClose={onClose} title={`Notes — ${call.prospect||'Call'}`}>
      <div style={{maxHeight:180,overflowY:'auto',marginBottom:12,display:'flex',flexDirection:'column',gap:8}}>
        {list.length===0
          ?<div style={{color:'#8891b8',fontSize:12,textAlign:'center',padding:'12px 0'}}>No notes yet.</div>
          :list.map(n=>(
            <div key={n.id} style={{background:'#080b14',borderRadius:8,padding:'8px 12px'}}>
              <div style={{fontSize:12}}>{n.text}</div>
              <div style={{fontSize:10,color:'#8891b8',marginTop:4}}>{fmtDate(n.date)}</div>
            </div>
          ))
        }
      </div>
      <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Add a note..." rows={3} style={{marginBottom:8}}/>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={save}>Save Note</button>
    </Modal>
  );
}

/* ── Revenue ── */
function Revenue({calls}){
  const [period,setPeriod]=useState('all');
  const [targetOpen,setTargetOpen]=useState(false);
  const [targetVal,setTargetVal]=useState('');
  const [tgt,setTgt]=useState(()=>parseFloat(localStorage.getItem('nl_target')||'0'));
  const periods=[['all','Total'],['today','Today'],['3d','3 Days'],['7d','7 Days'],['month','This Month'],['year','This Year']];

  const getFrom=p=>{
    const n=new Date();
    if(p==='today')return new Date(n.getFullYear(),n.getMonth(),n.getDate());
    if(p==='3d'){const d=new Date(n);d.setDate(n.getDate()-3);return d;}
    if(p==='7d'){const d=new Date(n);d.setDate(n.getDate()-7);return d;}
    if(p==='month')return new Date(n.getFullYear(),n.getMonth(),1);
    if(p==='year')return new Date(n.getFullYear(),0,1);
    return null;
  };

  const filtered=useMemo(()=>{
    const from=getFrom(period);if(!from)return calls;
    return calls.filter(c=>new Date(c.created_date)>=from);
  },[calls,period]);

  const cc=filtered.filter(c=>c.amount).reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const closed=filtered.filter(c=>['PIF','Installment'].includes(c.type)).length;
  const comm=filtered.reduce((s,c)=>s+parseFloat(c.commission||0),0);
  const ccpc=closed>0?cc/closed:0;

  const chartData=useMemo(()=>{
    const sorted=[...filtered].filter(c=>c.amount).sort((a,b)=>new Date(a.created_date)-new Date(b.created_date));
    let cum=0;
    return sorted.map(c=>{cum+=parseFloat(c.amount||0);return{label:fmtDate(c.created_date),cc:+cum.toFixed(2)};});
  },[filtered]);

  const now=new Date();
  const monthCC=calls.filter(c=>c.amount&&new Date(c.created_date).getMonth()===now.getMonth()&&new Date(c.created_date).getFullYear()===now.getFullYear()).reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const tgtPct=tgt>0?Math.min(100,Math.round(monthCC/tgt*100)):0;

  const saveTarget=()=>{
    const v=parseFloat(targetVal)||0;
    localStorage.setItem('nl_target',String(v));setTgt(v);setTargetOpen(false);toast('Target saved');
  };

  return(
    <div>
      <h1 style={{fontSize:18,fontWeight:700,marginBottom:16}}>Revenue <span style={gradText}>Overview</span></h1>
      <div style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
        {periods.map(([k,l])=>(
          <button key={k} onClick={()=>setPeriod(k)} style={{padding:'6px 14px',borderRadius:99,fontSize:12,fontWeight:500,cursor:'pointer',border:`1px solid ${period===k?'#2563eb':'#1e2540'}`,background:period===k?'rgba(37,99,235,.15)':'#0d1120',color:period===k?'#60a5fa':'#8891b8',transition:'all .15s',fontFamily:'inherit'}}>{l}</button>
        ))}
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,marginBottom:12}}>
        <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>Cash Collected</div>
        <div style={{fontSize:42,fontWeight:800,marginBottom:16,...gradText}}>{fmtMoney(cc)}</div>
        <div style={{height:200}}>
          {chartData.length>0
            ?<ResponsiveContainer width="100%" height="100%">
              <AreaChart data={chartData} margin={{top:5,right:10,left:0,bottom:5}}>
                <XAxis dataKey="label" tick={{fill:'rgba(136,145,184,.7)',fontSize:10}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:'rgba(136,145,184,.7)',fontSize:10}} tickLine={false} axisLine={false} tickFormatter={v=>'$'+Number(v).toLocaleString()} width={60}/>
                <Tooltip contentStyle={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:8,fontSize:12}} formatter={v=>['$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2}),'CC']}/>
                <Area type="monotone" dataKey="cc" stroke="#2563eb" fill="rgba(37,99,235,0.1)" strokeWidth={2}/>
              </AreaChart>
            </ResponsiveContainer>
            :<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#8891b8',fontSize:13}}>No data for this period</div>
          }
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:12,marginBottom:14}}>
        {[['Closed Deals',closed],['CCPC',fmtMoney(ccpc)],['Commission',fmtMoney(comm)]].map(([l,v])=>(
          <div key={l} style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:14}}>
            <div style={{fontSize:10,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>{l}</div>
            <div style={{fontSize:16,fontWeight:700}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:13,fontWeight:600}}>Monthly Target</span>
          <button className="btn btn-secondary" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>{setTargetVal(String(tgt||''));setTargetOpen(true);}}>Edit</button>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:8}}>
          <span>{fmtMoney(monthCC)} collected this month</span>
          <span style={{color:'#8891b8'}}>Target: {fmtMoney(tgt)}</span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:tgtPct+'%'}}/></div>
        <div style={{fontSize:11,color:'#8891b8',marginTop:6}}>{tgtPct}% of target</div>
      </div>
      <Modal open={targetOpen} onClose={()=>setTargetOpen(false)} title="Monthly Target">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Target ($)</label><input type="number" min="0" value={targetVal} onChange={e=>setTargetVal(e.target.value)}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={saveTarget}>Save</button>
        </div>
      </Modal>
    </div>
  );
}

/* ── Goals ── */
function Goals({goals,setGoals,goalLogs,setGoalLogs}){
  const [goalOpen,setGoalOpen]=useState(false);
  const [progOpen,setProgOpen]=useState(false);
  const [progId,setProgId]=useState(null);
  const [form,setForm]=useState({name:'',target:'',unit:'',notes:''});
  const [pF,setPF]=useState({value:'',note:''});

  const addGoal=()=>{
    if(!form.name.trim()){toast('Enter goal name','err');return;}
    const g={id:db.uid(),name:form.name.trim(),target:parseFloat(form.target)||null,unit:form.unit.trim(),notes:form.notes.trim(),done:false,created_date:db.now()};
    const u=[...goals,g];setGoals(u);db.set('goals',u);
    setForm({name:'',target:'',unit:'',notes:''});setGoalOpen(false);toast('Goal created');
  };
  const logProg=()=>{
    const val=parseFloat(pF.value)||0;if(!val){toast('Enter value','err');return;}
    const l={id:db.uid(),goal_id:progId,value:val,note:pF.note,created_date:db.now()};
    const u=[...goalLogs,l];setGoalLogs(u);db.set('goalLogs',u);
    setPF({value:'',note:''});setProgOpen(false);toast('Progress logged');
  };
  const markDone=(id,done)=>{const u=goals.map(g=>g.id===id?{...g,done}:g);setGoals(u);db.set('goals',u);};
  const delGoal=(id)=>{if(!confirm('Delete?'))return;const u=goals.filter(g=>g.id!==id);setGoals(u);db.set('goals',u);toast('Deleted');};

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <h1 style={{fontSize:18,fontWeight:700,margin:0}}>Goals <span style={gradText}>Tracker</span></h1>
        <button className="btn btn-primary" onClick={()=>setGoalOpen(true)}><Ic d={I.plus} size={13}/>New Goal</button>
      </div>
      {goals.length===0
        ?<div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:32,textAlign:'center',color:'#8891b8',fontSize:13}}>No goals yet. Create your first!</div>
        :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12}}>
          {goals.map(g=>{
            const logs=goalLogs.filter(l=>l.goal_id===g.id);
            const prog=logs.reduce((s,l)=>s+parseFloat(l.value||0),0);
            const pct=g.target?Math.min(100,Math.round(prog/g.target*100)):0;
            return(
              <div key={g.id} style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:16,opacity:g.done?.5:1}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{g.name}{g.done&&<span className="badge badge-green" style={{marginLeft:6}}>Done</span>}</div>
                    {g.notes&&<div style={{fontSize:11,color:'#8891b8'}}>{g.notes}</div>}
                  </div>
                  <div style={{display:'flex',gap:4,marginLeft:8,flexShrink:0}}>
                    {!g.done&&<button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{setProgId(g.id);setProgOpen(true);}}>+Log</button>}
                    <button className="btn btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>markDone(g.id,!g.done)}>{g.done?'Reopen':'Done'}</button>
                    <button className="btn btn-danger" style={{padding:'3px 8px',fontSize:14}} onClick={()=>delGoal(g.id)}>&times;</button>
                  </div>
                </div>
                {g.target&&<>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#8891b8',marginBottom:4}}>
                    <span>{prog.toLocaleString()} {g.unit||''}</span>
                    <span>/ {parseFloat(g.target).toLocaleString()} {g.unit||''}</span>
                  </div>
                  <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}/></div>
                  <div style={{fontSize:11,color:'#8891b8',marginTop:4}}>{pct}% complete</div>
                </>}
                {logs.length>0&&<div style={{fontSize:11,color:'#8891b8',marginTop:8}}>{logs.length} log {logs.length===1?'entry':'entries'}</div>}
              </div>
            );
          })}
        </div>
      }
      <Modal open={goalOpen} onClose={()=>setGoalOpen(false)} title="New Goal">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Goal Name</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Hit $10k this month"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Target</label><input type="number" value={form.target} onChange={e=>setForm({...form,target:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Unit</label><input value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} placeholder="$, calls, deals"/></div>
          </div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={2}/></div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={addGoal}>Create Goal</button>
        </div>
      </Modal>
      <Modal open={progOpen} onClose={()=>setProgOpen(false)} title="Log Progress">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Amount</label><input type="number" value={pF.value} onChange={e=>setPF({...pF,value:e.target.value})}/></div>
            <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Note</label><input value={pF.note} onChange={e=>setPF({...pF,note:e.target.value})} placeholder="Optional"/></div>
          </div>
          <button className="btn btn-primary" style={{width:'100%',padding:10}} onClick={logProg}>Log Progress</button>
        </div>
      </Modal>
    </div>
  );
}

/* ── Settings ── */
function Settings({user,setUser}){
  const [name,setName]=useState(user?.name||'');
  const [role,setRole]=useState(user?.role||'Closer');
  const save=()=>{
    const u={...user,name:name.trim()||user?.name,role};
    setUser(u);db.set('user',u);toast('Settings saved');
  };
  return(
    <div>
      <h1 style={{fontSize:18,fontWeight:700,marginBottom:20}}>Settings</h1>
      <div style={{background:'#0d1120',border:'1px solid #1e2540',borderRadius:12,padding:20,maxWidth:400}}>
        <div style={{fontSize:11,color:'#8891b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:16}}>Profile</div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Display Name</label><input value={name} onChange={e=>setName(e.target.value)}/></div>
          <div><label style={{fontSize:11,color:'#8891b8',display:'block',marginBottom:4}}>Role</label>
            <select value={role} onChange={e=>setRole(e.target.value)}>
              <option>Setter</option><option>Closer</option><option>Admin</option>
            </select>
          </div>
          <button className="btn btn-primary" style={{padding:10}} onClick={save}>Save Changes</button>
        </div>
      </div>
    </div>
  );
}

/* ── App Root ── */
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('home');
  const [mobOpen,setMobOpen]=useState(false);
  const [calls,setCalls]=useState(()=>db.get('calls'));
  const [installments,setInstallments]=useState(()=>db.get('installments'));
  const [companies,setCompanies]=useState(()=>db.get('companies'));
  const [goals,setGoals]=useState(()=>db.get('goals'));
  const [goalLogs,setGoalLogs]=useState(()=>db.get('goalLogs'));

  useEffect(()=>{
    // Hide loading screen
    const el=document.getElementById('app-loading');
    if(el)el.style.display='none';
    // Restore user session
    const u=db.get('user',null);
    if(u&&u.name)setUser(u);
  },[]);

  const signOut=()=>{db.set('user',null);setUser(null);};

  const pages={
    home:<Home calls={calls} installments={installments} goals={goals} goalLogs={goalLogs} setPage={setPage} user={user}/>,
    dashboard:<Dashboard calls={calls} setCalls={setCalls} installments={installments} setInstallments={setInstallments} companies={companies} setCompanies={setCompanies}/>,
    revenue:<Revenue calls={calls}/>,
    goals:<Goals goals={goals} setGoals={setGoals} goalLogs={goalLogs} setGoalLogs={setGoalLogs}/>,
    settings:<Settings user={user} setUser={setUser}/>,
  };

  if(!user) return <><ToastHost/><Login onLogin={setUser}/></>;

  return(
    <>
      <ToastHost/>
      <Sidebar page={page} setPage={setPage} user={user} onSignOut={signOut} mobileOpen={mobOpen} setMobileOpen={setMobOpen}/>
      <button className="mobile-menu-btn" onClick={()=>setMobOpen(true)} style={{position:'fixed',top:12,left:12,zIndex:35,background:'#0d1120',border:'1px solid #1e2540',borderRadius:8,padding:'6px 8px',cursor:'pointer',display:'none',alignItems:'center',color:'#8891b8'}}>
        <Ic d={I.menu} size={18}/>
      </button>
      <main className="main-content" style={{minHeight:'100vh',padding:'20px 16px'}}>
        {pages[page]||pages.home}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
